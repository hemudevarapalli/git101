name: Validate Data Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/validate-data-pipeline.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run end-to-end pipeline
        run: python src/run_pipeline.py

      - name: Upload Power BI-ready tables
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-star-schema
          path: data/powerbi/*.csv
          retention-days: 7
